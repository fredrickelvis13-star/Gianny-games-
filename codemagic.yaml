workflows:
  android-unity:
    name: Build Android APK
    instance_type: mac_mini_m1
    environment:
      android_sdk_tools: latest
    scripts:
      - name: Set Unity Version
        script: |
          #!/bin/bash
          echo "Using Unity 2022.3.22f1"
      - name: Build Unity Android
        script: |
          unity-builder build-android -v 2022.3.22f1
    artifacts:
      - build/*.apk