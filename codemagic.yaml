workflows:
  android-unity:
    name: Build Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      unity: 2022.3.22f1
    scripts:
      - name: Build Android
        script: |
          /Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity \
          -batchmode \
          -quit \
          -projectPath $CM_BUILD_DIR \
          -executeMethod BuildScript.BuildAndroid \
          -logFile -
    artifacts:
      - build/*.apk